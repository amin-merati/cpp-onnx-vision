name: C++ CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/download_assets.py --model
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DONNXRUNTIME_ROOT="$PWD/deps/onnxruntime-linux-x64-1.20.1"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python tests/reference_test.py --exe build/vision_infer --work build/model-parity --model models/squeezenet1.1-7.onnx
